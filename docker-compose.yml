version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agrodrop_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: agrodrop
      MONGO_INITDB_ROOT_PASSWORD: agrodrop123
      MONGO_INITDB_DATABASE: agrodrop
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agrodrop_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://agrodrop:agrodrop123@mongodb:27017/agrodrop?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_here_change_this_in_production
      CORS_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    image: nginx:alpine
    container_name: agrodrop_frontend
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  mongodb_data:

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management – AgroDrop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-wrapper" id="app"></div>

    <div class="modal-overlay" id="user-modal">
        <div class="modal" style="max-width:580px">
            <div class="modal-header">
                <h3><i class="fas fa-user"></i> <span id="modal-title">Add New User</span></h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="user-form" novalidate>
                    <input type="hidden" id="user-id" />
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name <span class="req">*</span></label>
                            <input type="text" class="form-control" id="u-name" placeholder="e.g. John Doe" required />
                        </div>
                        <div class="form-group">
                            <label>Business Name</label>
                            <input type="text" class="form-control" id="u-business" placeholder="e.g. AgroDrop Ltd" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email Address <span class="req">*</span></label>
                            <input type="email" class="form-control" id="u-email" placeholder="user@example.com"
                                required />
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" class="form-control" id="u-phone" placeholder="+256 700 000000" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Role <span class="req">*</span></label>
                            <select class="form-control" id="u-role" required>
                                <option value="">Select role</option>
                                <option>Administrator</option>
                                <option>Store Manager</option>
                                <option>Sales Attendant</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Password <span class="req" id="pwd-req">*</span></label>
                            <input type="password" class="form-control" id="u-password" placeholder="Enter password" />
                            <p class="form-text" id="pwd-hint" style="display:none;">Leave blank to keep existing
                                password.</p>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="save-user-btn"><i class="fas fa-save"></i> Save User</button>
            </div>
        </div>
    </div>

    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/sidebar.js" defer></script>
    <script src="js/users.js" defer></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchases – AgroDrop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-wrapper" id="app"></div>

    <div class="modal-overlay" id="pur-modal">
        <div class="modal" style="max-width:520px">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Record New Purchase</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="pur-form" novalidate>
                    <div class="form-group">
                        <label>Supplier <span class="req">*</span></label>
                        <select class="form-control" id="pur-supplier" required>
                            <option value="">Select supplier</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Medicine <span class="req">*</span></label>
                        <select class="form-control" id="pur-medicine" required>
                            <option value="">Select medicine</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Quantity <span class="req">*</span></label>
                            <input type="number" class="form-control" id="pur-qty" min="1" placeholder="0" required
                                oninput="calcPurTotal()" />
                        </div>
                        <div class="form-group">
                            <label>Buying Price per Unit (UGX) <span class="req">*</span></label>
                            <input type="number" class="form-control" id="pur-price" min="0" placeholder="0" required
                                oninput="calcPurTotal()" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Total Cost (UGX)</label>
                        <input type="text" class="form-control" id="pur-total" readonly
                            style="background:#f5f5f5;font-weight:700;color:var(--primary);font-size:16px;" />
                    </div>
                    <div class="form-group">
                        <label>Purchase Date <span class="req">*</span></label>
                        <input type="date" class="form-control" id="pur-date" required />
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="save-pur-btn"><i class="fas fa-save"></i> Save Purchase</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/purchases.js"></script>
</body>

</html>

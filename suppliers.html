<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers – AgroDrop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-wrapper" id="app"></div>

    <div class="modal-overlay" id="sup-modal">
        <div class="modal" style="max-width:500px">
            <div class="modal-header">
                <h3><i class="fas fa-truck"></i> <span id="modal-title">Add Supplier</span></h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="sup-form" novalidate>
                    <input type="hidden" id="sup-id" />
                    <div class="form-group">
                        <label>Supplier Name <span class="req">*</span></label>
                        <input type="text" class="form-control" id="sup-name" placeholder="e.g. Norbrook Uganda Ltd"
                            required />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number <span class="req">*</span></label>
                            <input type="text" class="form-control" id="sup-phone" placeholder="+256 700 000000"
                                required />
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="form-control" id="sup-email"
                                placeholder="supplier@example.com" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea class="form-control" id="sup-address" rows="2"
                            placeholder="Street, City, District"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="save-sup-btn"><i class="fas fa-save"></i> Save Supplier</button>
            </div>
        </div>
    </div>

    <!-- View Supplier Modal -->
    <div class="modal-overlay" id="view-sup-modal">
        <div class="modal" style="max-width:500px">
            <div class="modal-header">
                <h3><i class="fas fa-info-circle"></i> Supplier Details</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="view-sup-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Close</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/suppliers.js"></script>
</body>

</html>

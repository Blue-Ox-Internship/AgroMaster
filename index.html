<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroMaster – Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <div class="logo-icon">
                <!-- AgroDrop SVG Logo: crops + animals -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="90" height="75">
                    <circle cx="60" cy="50" r="48" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" />
                    <path d="M60 20 L86 34 V52 Q86 70 60 84 Q34 70 34 52 V34 Z" fill="#2e7d32" />
                    <path d="M60 26 L78 36 V52 Q78 66 60 77 Q42 66 42 52 V36 Z" fill="#43a047" />
                    <rect x="54" y="36" width="12" height="26" rx="3" fill="white" />
                    <rect x="46" y="44" width="28" height="10" rx="3" fill="white" />
                    <rect x="56" y="40" width="8" height="18" rx="1.5" fill="rgba(255,255,255,0.3)" />
                    <rect x="50" y="46" width="20" height="6" rx="1.5" fill="rgba(255,255,255,0.3)" />
                    <circle cx="60" cy="50" r="3.5" fill="rgba(255,255,255,0.5)" />
                    <g transform="translate(82, 22) rotate(35)">
                        <rect x="0" y="0" width="18" height="6" rx="2" fill="#66bb6a" />
                        <line x1="18" y1="3" x2="26" y2="3" stroke="#43a047" stroke-width="2.5" />
                        <line x1="26" y1="0" x2="28" y2="3" stroke="#43a047" stroke-width="1.5" />
                        <line x1="26" y1="6" x2="28" y2="3" stroke="#43a047" stroke-width="1.5" />
                        <rect x="3" y="-1" width="3" height="8" rx="1" fill="#a5d6a7" />
                    </g>
                    <ellipse cx="34" cy="42" rx="6" ry="3.5" fill="#66bb6a" transform="rotate(-15 34 42)" />
                    <ellipse cx="34" cy="42" rx="2.5" ry="3.5" fill="white" transform="rotate(-15 34 42)" />
                </svg>
            </div>
            <h1>AgroMaster</h1>
            <p>Uganda</p>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required />
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required />
                    <button type="button" id="togglePassword"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9e9e9e;cursor:pointer;font-size:15px;">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink"><i class="fas fa-key"></i> Forgot Password?</a>
            </div>
            <div id="loginError"
                style="display:none;background:#ffebee;color:#c62828;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;border-left:3px solid #c62828;">
                <i class="fas fa-exclamation-circle"></i> <span id="loginErrorMsg">Invalid email or password.</span>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="login-footer">
            &copy; 2026 AgroMaster Uganda Ltd.
        </div>
    </div>

    <script src="js/data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
        function fillLogin(email, pass) {
            var e = document.getElementById('email');
            var p = document.getElementById('password');
            if (e) e.value = email;
            if (p) p.value = pass;
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (App.getCurrentUser()) { window.location.href = 'dashboard.html'; return; }

            document.getElementById('togglePassword').addEventListener('click', function () {
                var pwd = document.getElementById('password');
                var icon = this.querySelector('i');
                if (pwd.type === 'password') {
                    pwd.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    pwd.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });

            document.getElementById('forgotPasswordLink').addEventListener('click', function (e) {
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                if (!email) {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('loginErrorMsg').textContent = 'Please enter your email address first.';
                    return;
                }
                alert('A password reset link has been sent to ' + email);
            });

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;
                var btn = document.getElementById('loginBtn');
                var errBox = document.getElementById('loginError');

                if (!email || !password) {
                    errBox.style.display = 'block';
                    document.getElementById('loginErrorMsg').textContent = 'Please enter your email and password.';
                    return;
                }

                btn.innerHTML = '<span class="spinner"></span> Signing in...';
                btn.disabled = true;

                API.login(email, password).then(function (result) {
                    if (result.status === 'success') {
                        App.setCurrentUser(result.user);
                        window.location.href = 'dashboard.html';
                    } else {
                        errBox.style.display = 'block';
                        document.getElementById('loginErrorMsg').textContent = result.message || 'Invalid email or password. Please try again.';
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                        btn.disabled = false;
                    }
                }).catch(function () {
                    errBox.style.display = 'block';
                    document.getElementById('loginErrorMsg').textContent = 'Unable to reach the live API. Please try again shortly.';
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    btn.disabled = false;
                });
            });
        });
    </script>
</body>

</html>
